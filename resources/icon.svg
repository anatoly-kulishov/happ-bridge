<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Happ Bridge">
  <defs>
    <linearGradient id="bg" x1="96" y1="32" x2="416" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1d26"/>
      <stop offset="100%" stop-color="#0e1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="256" y1="120" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- Bridge mark: arch + deck + piers + apex node -->
  <g
    fill="none"
    stroke="url(#mark)"
    stroke-width="28"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- arch -->
    <path d="M128 268c0-72 48-120 128-120s128 48 128 120"/>
    <!-- deck -->
    <path d="M118 268h276"/>
    <!-- piers -->
    <path d="M168 268v84"/>
    <path d="M256 268v84"/>
    <path d="M344 268v84"/>
  </g>
  <circle cx="256" cy="148" r="18" fill="url(#mark)"/>
</svg>
